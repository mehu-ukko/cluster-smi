name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  GO_VERSION: '1.27'
  GOLANGCI_LINT_VERSION: v2.1.0

jobs:
  lint:
    name: lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux]
        goarch: [amd64]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        run: |
          go build -o cluster-smi ./cmd/cluster-smi
          go build -o cluster-smi-router ./cmd/cluster-smi-router
          go build -o cluster-smi-node ./cmd/cluster-smi-node
          go build -o cluster-smi-local ./cmd/cluster-smi-local
      - name: Vet
        run: go vet ./cluster/... ./cmd/... ./internal/... ./proc/...
      - uses: actions/upload-artifact@v4
        with:
          name: cluster-smi-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            cluster-smi
            cluster-smi-router
            cluster-smi-node
            cluster-smi-local

  release:
    name: release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cluster-smi-linux-amd64
          path: artifacts/cluster-smi-linux-amd64
      - name: Package
        run: |
          cd artifacts/cluster-smi-linux-amd64 && chmod +x * && tar czf ../../cluster-smi-${GITHUB_REF_NAME}-linux-amd64.tar.gz cluster-smi cluster-smi-router cluster-smi-node cluster-smi-local && cd ../..
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            cluster-smi-*-linux-amd64.tar.gz

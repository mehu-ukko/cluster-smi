name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: v2.15.0
  # renovate: datasource=go depName=golang.org/x/vuln
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  lint:
    name: lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  govulncheck:
    name: vulncheck (govulncheck)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  build:
    name: build (linux/amd64)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: make
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - uses: actions/upload-artifact@v7
        with:
          name: cluster-smi-linux-amd64
          path: |
            cluster-smi
            cluster-smi-router
            cluster-smi-node
            cluster-smi-local

  release:
    name: release
    needs: [lint, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cluster-smi-linux-amd64
          path: artifacts/cluster-smi-linux-amd64
      - name: Package
        run: |
          cd artifacts/cluster-smi-linux-amd64
          chmod +x cluster-smi cluster-smi-router cluster-smi-node cluster-smi-local
          tar czf "$GITHUB_WORKSPACE/cluster-smi-${GITHUB_REF_NAME}-linux-amd64.tar.gz" cluster-smi cluster-smi-router cluster-smi-node cluster-smi-local
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            cluster-smi-*-linux-amd64.tar.gz

  notify-anitya:
    name: notify release-monitoring.org
    needs: [release]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger Anitya version check
        env:
          ANITYA_TOKEN: ${{ secrets.ANITYA_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST https://release-monitoring.org/api/v2/versions/ \
            -H "Authorization: token ${ANITYA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"id": 392713, "dry_run": false}'

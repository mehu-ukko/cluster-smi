name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  GO_VERSION: '1.21'
  GOLANGCI_LINT_VERSION: v1.62

jobs:
  lint:
    name: lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  build:
    name: build (no CUDA)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        run: |
          go build -o cluster-smi ./cmd/cluster-smi
          go build -o cluster-smi-router ./cmd/cluster-smi-router
      - name: Vet
        run: go vet ./cluster/... ./internal/...
      - uses: actions/upload-artifact@v4
        with:
          name: cluster-smi-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            cluster-smi
            cluster-smi-router

  # NOTE: CUDA build stays amd64-only because the nvidia/cuda container
  # image we use is published for linux/amd64 only.
  build-cuda:
    name: build (with CUDA)
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.4.0-devel-ubuntu22.04
    steps:
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        run: |
          export CGO_LDFLAGS="-L/usr/local/cuda/lib64/stubs"
          go build -o cluster-smi ./cmd/cluster-smi
          go build -o cluster-smi-router ./cmd/cluster-smi-router
          go build -o cluster-smi-node ./cmd/cluster-smi-node
          go build -o cluster-smi-local ./cmd/cluster-smi-local
      - uses: actions/upload-artifact@v4
        with:
          name: cluster-smi-cuda-linux-amd64
          path: |
            cluster-smi
            cluster-smi-router
            cluster-smi-node
            cluster-smi-local

  release:
    name: release
    needs: [build, build-cuda]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cluster-smi-linux-amd64
          path: artifacts/no-cuda-amd64
      - uses: actions/download-artifact@v4
        with:
          name: cluster-smi-linux-arm64
          path: artifacts/no-cuda-arm64
      - uses: actions/download-artifact@v4
        with:
          name: cluster-smi-cuda-linux-amd64
          path: artifacts/cuda
      - name: Package
        run: |
          cd artifacts/no-cuda-amd64 && chmod +x * && tar czf ../../cluster-smi-${GITHUB_REF_NAME}-linux-amd64.tar.gz cluster-smi cluster-smi-router && cd ../..
          cd artifacts/no-cuda-arm64 && chmod +x * && tar czf ../../cluster-smi-${GITHUB_REF_NAME}-linux-arm64.tar.gz cluster-smi cluster-smi-router && cd ../..
          cd artifacts/cuda && chmod +x * && tar czf ../../cluster-smi-${GITHUB_REF_NAME}-cuda-linux-amd64.tar.gz cluster-smi cluster-smi-router cluster-smi-node cluster-smi-local && cd ../..
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            cluster-smi-*-linux-amd64.tar.gz
            cluster-smi-*-linux-arm64.tar.gz
            cluster-smi-*-cuda-linux-amd64.tar.gz

name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    name: build (no CUDA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build
        run: |
          cp config.example.go config.go
          go build -o cluster-smi cluster-smi.go config.go
          go build -o cluster-smi-router cluster-smi-router.go config.go
      - name: Vet
        run: go vet ./cluster/...
      - uses: actions/upload-artifact@v4
        with:
          name: cluster-smi-linux-amd64
          path: |
            cluster-smi
            cluster-smi-router

  build-cuda:
    name: build (with CUDA)
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.4.0-devel-ubuntu22.04
    steps:
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build
        run: |
          cp config.example.go config.go
          export CGO_LDFLAGS="-L/usr/local/cuda/lib64/stubs"
          go build -o cluster-smi cluster-smi.go config.go
          go build -o cluster-smi-router cluster-smi-router.go config.go
          go build -o cluster-smi-node cluster-smi-node.go config.go cluster.go
          go build -o cluster-smi-local cluster-smi-local.go config.go cluster.go
      - uses: actions/upload-artifact@v4
        with:
          name: cluster-smi-cuda-linux-amd64
          path: |
            cluster-smi
            cluster-smi-router
            cluster-smi-node
            cluster-smi-local

  release:
    name: release
    needs: [build, build-cuda]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cluster-smi-linux-amd64
          path: artifacts/no-cuda
      - uses: actions/download-artifact@v4
        with:
          name: cluster-smi-cuda-linux-amd64
          path: artifacts/cuda
      - name: Package
        run: |
          cd artifacts/no-cuda && chmod +x * && tar czf ../../cluster-smi-${GITHUB_REF_NAME}-linux-amd64.tar.gz cluster-smi cluster-smi-router && cd ../..
          cd artifacts/cuda && chmod +x * && tar czf ../../cluster-smi-${GITHUB_REF_NAME}-cuda-linux-amd64.tar.gz cluster-smi cluster-smi-router cluster-smi-node cluster-smi-local && cd ../..
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            cluster-smi-*-linux-amd64.tar.gz

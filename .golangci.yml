version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused

  settings:
    govet:
      enable:
        - shadow
      disable:
        - composites

  exclusions:
    # Unchecked errors from Close() and similar.
    presets:
      - std-error-handling
    rules:
      # proc cgo wrapper depends on Linux headers.
      - path: proc/
        linters: [unused, errcheck, staticcheck]

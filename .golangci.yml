version: "2"

run:
  build-tags:
    - cuda

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused

  settings:
    govet:
      enable:
        - shadow
      disable:
        - composites

  exclusions:
    rules:
      # NVML cgo wrapper requires CUDA headers; not built on default lint runs.
      - path: nvml/
        linters: [unused, errcheck, staticcheck]
      # proc cgo wrapper depends on Linux headers.
      - path: proc/
        linters: [unused, errcheck, staticcheck]
